<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination & SignalR Real-Time Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/signalr.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

            .header h1 {
                color: #333;
                margin-bottom: 10px;
            }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s ease;
        }

            .status-indicator.connected {
                background: #10b981;
                box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            }

        .status-text {
            color: #666;
            font-size: 14px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

            .card h2 {
                color: #333;
                margin-bottom: 20px;
                font-size: 18px;
                border-bottom: 2px solid #667eea;
                padding-bottom: 10px;
            }

        /* Pagination Styles */
        .items-container {
            min-height: 300px;
        }

        .item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-info h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .item-info p {
            color: #999;
            font-size: 12px;
        }

        .item-badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .pagination-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

            button:hover {
                background: #764ba2;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            button:disabled {
                background: #ccc;
                cursor: not-allowed;
                transform: none;
            }

        .page-info {
            color: #666;
            font-size: 14px;
            min-width: 150px;
            text-align: center;
        }

        /* Notifications Styles */
        .notifications-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .notification {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            animation: slideIn 0.3s ease;
        }

            .notification.error {
                background: #fef2f2;
                border-left-color: #ef4444;
            }

            .notification.success {
                background: #f0fdf4;
                border-left-color: #10b981;
            }

            .notification.warning {
                background: #fffbeb;
                border-left-color: #f59e0b;
            }

        .notification-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .notification-message {
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .notification-time {
            color: #999;
            font-size: 11px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

            .control-group input {
                flex: 1;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 14px;
            }

        .page-size-select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>?? Pagination & SignalR Real-Time Demo</h1>
            <div class="connection-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="statusText">Connecting...</span>
                <span class="status-text" id="connectionCount">Total Connections: 0</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Left: Pagination Demo -->
            <div class="card">
                <h2>?? Pagination Demo</h2>

                <div class="controls">
                    <div class="control-group">
                        <label>Page Size:</label>
                        <select class="page-size-select" id="pageSizeSelect">
                            <option value="5">5 items</option>
                            <option value="10" selected>10 items</option>
                            <option value="20">20 items</option>
                            <option value="50">50 items</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <input type="text" id="searchInput" placeholder="Search..." />
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-value" id="currentPage">1</div>
                        <div class="stat-label">Current Page</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalPages">1</div>
                        <div class="stat-label">Total Pages</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalItems">0</div>
                        <div class="stat-label">Total Items</div>
                    </div>
                </div>

                <div class="items-container" id="itemsContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading...</p>
                    </div>
                </div>

                <div class="pagination-controls">
                    <button id="prevBtn" onclick="previousPage()">? Previous</button>
                    <span class="page-info">
                        Page <span id="pageDisplay">1</span> of <span id="totalPagesDisplay">1</span>
                    </span>
                    <button id="nextBtn" onclick="nextPage()">Next ?</button>
                </div>
            </div>

            <!-- Right: SignalR Notifications -->
            <div class="card">
                <h2>?? Real-Time Notifications</h2>

                <button onclick="testNotification()" style="width: 100%; margin-bottom: 15px;">
                    Send Test Notification
                </button>

                <button onclick="startLiveStream()" style="width: 100%; margin-bottom: 15px;">
                    Start Live Data Stream
                </button>

                <div class="notifications-container" id="notificationsContainer">
                    <div class="loading">
                        <p>Waiting for notifications...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>// ===== Pagination Logic =====
        let currentPage = 1;
        let pageSize = 10;
        let totalItems = 0;
        const API_URL = 'https://jsonplaceholder.typicode.com/posts';

        document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value);
            currentPage = 1;
            loadPaginatedData();
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            loadPaginatedData();
        });

        async function loadPaginatedData() {
            try {
                const container = document.getElementById('itemsContainer');
                container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';

                const response = await fetch(API_URL);
                let data = await response.json();

                // Simulate search
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                if (searchTerm) {
                    data = data.filter(item =>
                        item.title.toLowerCase().includes(searchTerm) ||
                        item.body.toLowerCase().includes(searchTerm)
                    );
                }

                totalItems = data.length;
                const totalPages = Math.ceil(totalItems / pageSize);
                const startIndex = (currentPage - 1) * pageSize;
                const paginatedData = data.slice(startIndex, startIndex + pageSize);

                // Update UI
                document.getElementById('currentPage').textContent = currentPage;
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('totalItems').textContent = totalItems;
                document.getElementById('pageDisplay').textContent = currentPage;
                document.getElementById('totalPagesDisplay').textContent = totalPages;

                // Render items
                container.innerHTML = paginatedData.map((item, index) => `
                    <div class="item">
                        <div class="item-info">
                            <h3>${item.title}</h3>
                            <p>${item.body.substring(0, 80)}...</p>
                        </div>
                        <span class="item-badge">ID: ${item.id}</span>
                    </div>
                `).join('');

                // Update button states
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage === totalPages;

            } catch (error) {
                document.getElementById('itemsContainer').innerHTML =
                    `<div class="loading" style="color: red;"><p>Error loading data: ${error.message}</p></div>`;
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadPaginatedData();
                window.scrollTo(0, 0);
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(totalItems / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                loadPaginatedData();
                window.scrollTo(0, 0);
            }
        }

        // ===== SignalR Logic =====
        let connection;
        let notificationCount = 0;

        async function initSignalR() {
            connection = new signalR.HubConnectionBuilder()
                .withUrl('/hubs/notifications')
                .withAutomaticReconnect([0, 0, 0, 1000, 3000, 5000])
                .build();

            connection.on('UserConnected', (data) => {
                addNotification('?? User Connected', data.message, 'success');
                updateConnectionStatus('connected');
            });

            connection.on('UserDisconnected', (data) => {
                addNotification('?? User Disconnected', data.message, 'warning');
            });

            connection.on('ReceiveNotification', (notification) => {
                const type = notification.type === 'private' ? '?? Private' : '?? Broadcast';
                addNotification(`${type}: ${notification.title}`, notification.message, 'info');
            });

            connection.on('LiveDataUpdate', (data) => {
                addNotification('?? Live Update', `${data.label} - Value: ${data.value}`, 'success');
            });

            connection.on('LiveDataStarted', (message) => {
                addNotification('?? Stream Started', message, 'success');
            });

            connection.on('LiveDataCompleted', (message) => {
                addNotification('?? Stream Completed', message, 'success');
            });

            connection.on('ConnectionStats', (stats) => {
                document.getElementById('connectionCount').textContent =
                    `Total Connections: ${stats.totalConnections}`;
            });

            connection.onreconnecting((error) => {
                updateConnectionStatus('reconnecting');
                addNotification('?? Reconnecting', 'Connection lost. Attempting to reconnect...', 'warning');
            });

            connection.onreconnected((connectionId) => {
                updateConnectionStatus('connected');
                addNotification('? Reconnected', 'Connection re-established', 'success');
            });

            connection.onclose((error) => {
                updateConnectionStatus('disconnected');
                if (error) {
                    addNotification('? Disconnected', `Connection closed: ${error}`, 'error');
                }
            });

            try {
                await connection.start();
                updateConnectionStatus('connected');
                addNotification('? Connected', 'Connected to real-time notifications hub', 'success');
                await connection.invoke('GetConnectionStats');
            } catch (err) {
                updateConnectionStatus('error');
                addNotification('? Connection Error', err.message, 'error');
                setTimeout(() => initSignalR(), 5000);
            }
        }

        function updateConnectionStatus(status) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');

            indicator.classList.remove('connected');

            switch (status) {
                case 'connected':
                    indicator.classList.add('connected');
                    text.textContent = '?? Connected';
                    break;
                case 'disconnected':
                    text.textContent = '?? Disconnected';
                    break;
                case 'reconnecting':
                    text.textContent = '?? Reconnecting...';
                    break;
                case 'error':
                    text.textContent = '?? Connection Error';
                    break;
            }
        }

        function addNotification(title, message, type = 'info') {
            notificationCount++;
            const container = document.getElementById('notificationsContainer');

            if (container.querySelector('.loading')) {
                container.innerHTML = '';
            }

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-message">${message}</div>
                <div class="notification-time">${new Date().toLocaleTimeString()}</div>
            `;

            container.insertBefore(notification, container.firstChild);

            // Keep only last 50 notifications
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        async function testNotification() {
            try {
                await connection.invoke('SendNotification',
                    'Test Notification',
                    `This is a test notification sent at ${new Date().toLocaleTimeString()}`
                );
            } catch (err) {
                addNotification('? Error', err.message, 'error');
            }
        }

        async function startLiveStream() {
            try {
                await connection.invoke('StartLiveDataStream');
            } catch (err) {
                addNotification('? Error', err.message, 'error');
            }
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            loadPaginatedData();
            initSignalR();
        });</script>
</body>
</html>
