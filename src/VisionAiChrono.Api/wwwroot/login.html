<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 24px;
        }

        .google-login-btn {
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            color: #3c4043;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }

        .google-login-btn:hover {
            background: #f8f9fa;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .info-box {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .callback-info {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 11px;
            color: #856404;
            border: 1px solid #ffeaa7;
            word-break: break-all;
        }

        .success-box {
            display: none;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 12px;
            word-break: break-all;
        }

        .token-value {
            margin-top: 8px;
            font-family: Consolas, monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login Test</h1>

        <div id="successBox" class="success-box">
            <strong>تم تسجيل الدخول بنجاح</strong>
            <div class="token-value" id="tokenValue"></div>
        </div>

        <div class="info-box">
            <strong>اختبار Google OAuth</strong><br>
            اضغط الزر لبدء تسجيل الدخول عبر Google. بعد الموافقة سيتم إنشاء الحساب أو ربطه وإصدار JWT.
        </div>

        <button class="google-login-btn" onclick="loginWithGoogle()">
            <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Sign in with Google
        </button>

        <div class="callback-info">
            <strong>Authorized redirect URI في Google Cloud:</strong><br>
            https://localhost:44355/signin-google
        </div>
    </div>

    <script>
        function loginWithGoogle() {
            // يبدأ الـ challenge — مش الـ callback مباشرة
            window.location.href = '/api/Auth/google?returnUrl=/login.html';
        }

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (token) {
                const box = document.getElementById('successBox');
                const tokenEl = document.getElementById('tokenValue');
                box.style.display = 'block';
                tokenEl.textContent = token;
                localStorage.setItem('accessToken', token);
                window.history.replaceState({}, document.title, '/login.html');
            }
        });
    </script>
</body>
</html>
